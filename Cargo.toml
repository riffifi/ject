[package]
name = "ject"
version = "0.9.1"
edition = "2021"
description = "A general-purpose scripting language with readable syntax and a mixed Ject/Rust package system."
license = "MIT"
repository = "https://github.com/riffifi/ject"
readme = "README.md"
keywords = ["scripting", "language", "interpreter", "repl"]
categories = ["command-line-utilities", "compilers"]
authors = ["Leo"]

[workspace]
members = ["crates/ject-native"]

[dependencies]
rustc-hash = "1.1"
smallvec = "1.10"
rustyline = "12.0"
ctrlc = "3.5"
serde_json = "1.0"
sha2 = "0.10"
semver = "1.0"
toml = "0.8"
toml_edit = "0.22"
flate2 = "1.0"
tar = "0.4"
ureq = "2.12"
colored = "2.0"
ject-native = { path = "crates/ject-native" }
libloading = "0.8"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
