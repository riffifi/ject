[package]
name = "ject"
version = "0.9.0"
edition = "2021"
description = "A general-purpose scripting language: readable syntax, native numeric arrays, and a native JGUI module, all in one binary."
license = "MIT"
repository = "https://github.com/riffifi/ject"
readme = "README.md"
keywords = ["scripting", "language", "interpreter", "repl"]
categories = ["command-line-utilities", "compilers"]
authors = ["Leo"]

[workspace]
members = ["crates/ject-native"]

[dependencies]
rustc-hash = "1.1"
smallvec = "1.10"
rustyline = "12.0"
ctrlc = "3.5"
serde_json = "1.0"
colored = "2.0"
ndarray = "0.15"
rand = "0.8"
eframe = "0.34.2"
ject-native = { path = "crates/ject-native" }
libloading = "0.8"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"
