name: Ject release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - scripts/test-install.sh
      - scripts/test-install.ps1
      - .github/workflows/release.yml
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, suffix: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test optimized runtime
        run: cargo test --release --locked --workspace --all-targets --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --bin ject --target ${{ matrix.target }}
      - name: Prepare and verify artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir dist
          asset="ject-$TARGET$SUFFIX"
          cp "target/$TARGET/release/ject$SUFFIX" "dist/$asset"
          version=$("dist/$asset" --version)
          if [[ "$GITHUB_REF_TYPE" == tag && "$version" != "ject ${GITHUB_REF_NAME#v}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match $version" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/$asset" | awk '{print $1}' > "dist/$asset.sha256"
          else
            shasum -a 256 "dist/$asset" | awk '{print $1}' > "dist/$asset.sha256"
          fi
          "dist/$asset" examples/01_hello.ject
      - name: Verify installer lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/test-install.sh "dist/ject-${{ matrix.target }}"
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 "dist/ject-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            install.sh install.ps1 dist/*
